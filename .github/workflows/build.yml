name: Build Spawning Overhaul
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
jobs:
  build-neoforge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Compile
        run: gradle clean build
      - uses: actions/upload-artifact@v4
        with:
          name: spawning-overhaul-neoforge-1.20.1
          path: build/libs/*.jar
          if-no-files-found: error
