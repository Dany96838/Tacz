name: Build Spawning Overhaul - NeoForge 1.20.1

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-neoforge:
    name: Build NeoForge 1.20.1 (47.1.106)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      # NeoForge 1.20.1 is the transitional 47.x branch:
      # it retains Forge package names and META-INF/mods.toml.
      - name: Prepare NeoForge-specific project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-neoforge
          cp settings.gradle gradle.properties .ci-neoforge/
          cp -R src .ci-neoforge/src

          rm -f .ci-neoforge/src/main/resources/META-INF/neoforge.mods.toml
          python3 - <<'PY'
          from pathlib import Path
          meta = Path('.ci-neoforge/src/main/resources/META-INF/mods.toml')
          text = meta.read_text()
          text = text.replace('versionRange="[47.3.0,)"', 'versionRange="[47.1.106,)"')
          text = text.replace('Forge.', 'NeoForge.')
          assert 'versionRange="[47.1.106,)"' in text
          meta.write_text(text)
          java = Path('.ci-neoforge/src/main/java/com/spawningoverhaul/SpawningOverhaul.java')
          source = java.read_text().replace('Forge 47.3.0', 'NeoForge 47.1.106')
          java.write_text(source)
          PY

          cat > .ci-neoforge/build.gradle <<'EOF'
          buildscript {
              repositories {
                  maven { url = 'https://maven.neoforged.net/releases' }
                  mavenCentral()
              }
              dependencies {
                  classpath 'net.neoforged.gradle:userdev:7.0.163'
              }
          }

          apply plugin: 'java'
          apply plugin: 'net.neoforged.gradle.userdev'

          group = 'com.spawningoverhaul'
          version = '1.20.1-0.1.0'
          base { archivesName = 'spawningoverhaul-neoforge-1.20.1' }

          java {
              toolchain.languageVersion = JavaLanguageVersion.of(17)
          }

          dependencies {
              implementation 'net.neoforged:forge:1.20.1-47.1.106'
          }

          tasks.withType(JavaCompile).configureEach {
              options.encoding = 'UTF-8'
              options.release = 17
          }

          tasks.named('processResources', ProcessResources).configure {
              inputs.properties(version: project.version)
              filesMatching('META-INF/mods.toml') {
                  expand(mod_version: project.version)
              }
          }
          EOF

          # Preflight: fail before Gradle if any target or metadata is wrong.
          grep -F "net.neoforged.gradle:userdev:7.0.163" .ci-neoforge/build.gradle
          grep -F "net.neoforged:forge:1.20.1-47.1.106" .ci-neoforge/build.gradle
          grep -F 'versionRange="[47.1.106,)"' .ci-neoforge/src/main/resources/META-INF/mods.toml
          grep -F '${mod_version}' .ci-neoforge/src/main/resources/META-INF/mods.toml
          test ! -e .ci-neoforge/src/main/resources/META-INF/neoforge.mods.toml

      - name: Compile NeoForge mod
        working-directory: .ci-neoforge
        run: gradle --no-daemon clean build

      - name: Validate packaged JAR
        working-directory: .ci-neoforge
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          jars=(build/libs/*.jar)
          test "${#jars[@]}" -eq 1
          jarfile="${jars[0]}"
          jar tf "$jarfile" | grep -Fx 'META-INF/mods.toml'
          if jar tf "$jarfile" | grep -q 'META-INF/neoforge.mods.toml'; then
            echo 'Unexpected post-1.20.1 NeoForge metadata found'
            exit 1
          fi
          unzip -p "$jarfile" META-INF/mods.toml | grep -F 'version="1.20.1-0.1.0"'
          unzip -p "$jarfile" META-INF/mods.toml | grep -F 'versionRange="[47.1.106,)"'
          jar tf "$jarfile" | grep -F 'com/spawningoverhaul/SpawningOverhaul.class'
          mv "$jarfile" build/libs/spawningoverhaul-neoforge-1.20.1-47.1.106.jar

      - uses: actions/upload-artifact@v4
        with:
          name: spawning-overhaul-neoforge-1.20.1-47.1.106
          path: .ci-neoforge/build/libs/spawningoverhaul-neoforge-1.20.1-47.1.106.jar
          if-no-files-found: error
