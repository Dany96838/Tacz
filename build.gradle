plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '6.0.24'
}
group = mod_group
version = mod_version
base { archivesName = mod_id + '-1.20.1-universal' }
java { toolchain.languageVersion = JavaLanguageVersion.of(17) }

minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        client { workingDirectory project.file('run'); mods { spawningoverhaul { source sourceSets.main } } }
        server { workingDirectory project.file('run-server'); mods { spawningoverhaul { source sourceSets.main } } }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.3.0'
    compileOnly 'org.spongepowered:mixin:0.8.5'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
    options.compilerArgs += [
        "-AoutRefMapFile=${projectDir}/src/main/resources/spawningoverhaul.refmap.json",
        "-AdefaultObfuscationEnv=searge"
    ]
}

// Register the Mixin configuration in the mod JAR for Forge and NeoForge 1.20.1.
jar {
    manifest {
        attributes([
            'MixinConfigs': 'spawningoverhaul.mixins.json'
        ])
    }
}

// The same JAR carries the Forge and legacy NeoForge 1.20.1 descriptors.
// Each loader reads its own descriptor; the source uses the shared 1.20.1 API.
processResources {
    inputs.property 'mod_version', mod_version
    filesMatching(['META-INF/mods.toml', 'META-INF/neoforge.mods.toml']) {
        expand 'mod_version': mod_version
    }
}
