plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '6.0.24'
}
group = mod_group
version = mod_version
base { archivesName = mod_id + '-forge' }
java { toolchain.languageVersion = JavaLanguageVersion.of(17) }
minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        client { workingDirectory project.file('run'); mods { spawningoverhaul { source sourceSets.main } } }
        server { workingDirectory project.file('run-server'); mods { spawningoverhaul { source sourceSets.main } } }
    }
}
dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.3.0'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 17 }
