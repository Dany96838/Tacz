plugins {
    id 'java'
    id 'net.neoforged.moddev.legacyforge' version '2.0.87'
}
group = mod_group
version = mod_version
base { archivesName = mod_id + '-neoforge' }
java { toolchain.languageVersion = JavaLanguageVersion.of(17) }
legacyForge {
    neoForgeVersion = project.neoforge_version
    runs {
        client { client(); gameDirectory = project.file('run') }
        server { server(); gameDirectory = project.file('run-server') }
    }
    mods { spawningoverhaul { sourceSet sourceSets.main } }
}
tasks.withType(JavaCompile).configureEach { options.encoding='UTF-8'; options.release=17 }
